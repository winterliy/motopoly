# 한 틱에 바꿀 최대 블록 수. 서버가 버벅이면 낮추세요.
blocks-per-tick: 20000
# 한 번에 생성할 수 있는 최대 칸(가로 x 세로) 수
max-columns: 262144
# 주변 지형 분석에 쓸 선택 영역 바깥 여백(블록)
analysis-margin: 8
# 플레이어마다 되돌릴 수 있는 작업 수
undo-depth: 5
# 새 지표면 아래 빈 공간(공기·물)을 최대 몇 블록 깊이까지 채울지
max-fill-depth: 64
# 새로 채운 돌·심층암에 바닐라처럼 높이별 광석 덩어리를 넣음 (석탄은 높은 곳, 다이아몬드는 Y 16 아래 등)
fill-ores: true
# 기복의 가로 크기(블록). 이보다 큰 산·골짜기는 걸러내고 잔 굴곡만 남김
scale: 48
# 같은 시드의 숨은 참조 월드(motopoly_ref_<월드이름>)에서 바닐라 지형의 잔 굴곡·지표 재질·풀을 가져옴.
# false면 바닐라를 흉내 낸 Perlin 노이즈로 기복을 만듦
reference-terrain: true
# 참조 월드에서 그 자리에 원래 났을 풀·꽃·큰 풀을 심음 (나무는 제외). 참조할 풀이 없는 잔디(바다 위 섬 등)에는 풀·꽃을 드문드문 심음
copy-plants: true
# 이웃한 칸끼리 허용하는 최대 높이 차(블록). 넘으면 경사를 완만하게 깎거나 채움(열 침식). 0이면 끔
max-step: 1
# 물가에서 몇 칸까지 모래 해변으로 만들지 (수면 -2 ~ +2 높이인 칸만)
beach-width: 5

# /mt config 기본값. 플레이어가 /mt config <항목>을 값 없이 치면 이 값으로 돌아가요.
defaults:
  # 가장자리 스무딩 폭(블록). 테두리에서 이만큼 안쪽까지 주변 지형에서 목표 높이로 서서히 바뀜
  smooth: 10
  # 기복 높이(블록). auto면 주변 지형을 분석해서 정함, 0이면 완전 평면
  rough: auto
