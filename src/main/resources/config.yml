# 한 틱에 바꿀 최대 블록 수. 서버가 버벅이면 낮추세요.
blocks-per-tick: 20000
# 한 번에 생성할 수 있는 최대 칸(가로 x 세로) 수
max-columns: 262144
# 주변 지형 분석에 쓸 선택 영역 바깥 여백(블록)
analysis-margin: 8
# 플레이어마다 되돌릴 수 있는 작업 수
undo-depth: 5
# 새 지표면 아래 빈 공간(공기·물)을 최대 몇 블록 깊이까지 채울지
max-fill-depth: 64
# 새로 채운 돌·심층암에 바닐라처럼 높이별 광석 덩어리를 넣음 (석탄은 높은 곳, 다이아몬드는 Y 16 아래 등)
fill-ores: true
# 기복의 가로 크기(블록). 이보다 큰 산·골짜기는 걸러내고 잔 굴곡만 남김
scale: 48
# 월드의 바닐라 생성기로 그 자리 지형을 즉석에서 계산해서(청크·월드를 만들지 않음) 굴곡과 바이옴별 지표 재질을 정함.
# false면 바닐라를 흉내 낸 Perlin 노이즈로 기복을 만들고, 지표는 주변 땅 재질을 씀
vanilla-terrain: true
# 연결 지대는 원래 풀을 그대로 옮기고, 새 잔디에는 풀·꽃을 드문드문 심음. 눈 바이옴에는 눈을 덮음 (나무는 제외)
copy-plants: true
# 이웃한 칸끼리 허용하는 최대 높이 차(블록) 기본값. 연결 지대가 높이 차에 비해 좁으면 이 값보다 가팔라짐. 0이면 끔.
# 플레이어별로 /mt config step <n>으로 바꿀 수 있음
max-step: 1
# 물가에서 몇 칸까지 모래 해변으로 만들지 (수면 ~ +2 높이이고, 근처 물 바닥이 모래인 곳만)
beach-width: 5

# /mt config 기본값. 플레이어가 /mt config <항목>을 값 없이 치면 이 값으로 돌아가요.
defaults:
  # 구역 바깥 연결 지대 폭(블록). 구역 밖 이만큼을 깎거나 쌓아서 새 땅과 주변 지형을 매끄럽게 이음.
  # 높이 차가 크면 경사가 가팔라짐(한 칸에 여러 블록). 0이면 구역 밖은 건드리지 않음
  distance: 10
  # 구역 모서리를 얼마나 둥글게 깎을지 0~100. 0이면 네모, 100이면 모서리 반지름이 짧은 변의 절반(정사각형이면 원).
  # 깎인 모서리는 연결 지대가 되어 주변 지형과 이어짐
  round: 0
  # 두 지점의 Y가 다를 때 얹는 잔 굴곡(블록). auto면 주변 지형을 분석해서 정함, 0이면 잔 굴곡 없음
  rough: auto
