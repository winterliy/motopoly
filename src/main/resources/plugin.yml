name: Motopoly
version: '${version}'
main: dev.motopoly.MotopolyPlugin
api-version: '26.3'
description: 선택 구역에 주변 지형과 자연스럽게 이어지는 땅을 생성하는 건축용 플러그인
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}

commands:
  motopoly:
    description: Motopoly 땅 생성 명령어
    usage: /<command> <pos1|pos2|gen <y>|config <smooth|rough> [값]|undo|help>
    aliases: [mt]
    permission: motopoly.use

permissions:
  motopoly.use:
    description: Motopoly 사용 권한
    default: op
